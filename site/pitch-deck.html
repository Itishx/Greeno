<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Greeno · Pitch deck</title>
<meta name="description" content="Greeno. The someone who runs your day. Thirteen slides.">
<meta property="og:title" content="Greeno · Pitch deck">
<meta property="og:description" content="The someone who runs your day.">
<link rel="icon" href="greeno.svg" type="image/svg+xml">
<style>
/* Greeno, the deck.
 *
 * One self-contained file. The stylesheet is inline, the fonts are inline, the
 * mascot is inline markup. It opens in a browser, it prints to 1280x720 PDF
 * pages, and it survives being emailed on its own.
 *
 * The design system is Greeno's, ported token for token from site/styles.css,
 * which is itself a port of app/renderer/tokens.css. Three rules carry over
 * whole and none of them get bent for a slide:
 *
 *   1. Display is EB Garamond 400. Never bold. More presence means bigger.
 *   2. Lavender is the ONLY primary action colour.
 *   3. No box-shadows. Elevation is a 2px ink border.
 *
 * Rule 3 is why the on-screen deck stacks slides with an outline rather than
 * the drop shadow a deck usually gets. It also happens to be what prints
 * correctly: Chromium renders a soft shadow as a flat grey slab that Preview
 * and every phone viewer draw opaquely across the slide.
 *
 * The one thing added here that the site does not have: --lav-ink. Lavender is
 * a fill colour with ink on top of it, so it cannot draw a line or set type on
 * cream. --lav-ink is its readable twin, used only for rules and small type on
 * the two lavender slides.
 */

@page { size: 1280px 720px; margin: 0; }

:root {
  --canvas:    #ffffeb;
  --surface:   #ffffeb;
  --stone:     #e4e4d0;
  --ink:       #1a1a1a;
  --charcoal:  #222222;
  --fog:       #8a8a80;

  --forest:    #034f46;
  --lavender:  #f0d7ff;
  --ember:     #ffa946;
  --on-dark:   #ffffeb;

  --greeno-light: #8ecb6a;
  --greeno:       #66b04a;
  --greeno-dark:  #3f7a34;

  --display: "EB Garamond", "Iowan Old Style", Georgia, serif;
  --body: "Figtree", -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;

  --r-btn: 12px;
  --r-card: 26px;      /* the site says 32. A 32px radius on a 150px card eats
                          its own corners, so the deck sizes it down and keeps
                          32 for the full-width panels only. */
  --r-card-lg: 32px;
  --r-pill: 9999px;

  /* deck only */
  --mat:     #dededa;                 /* the surface the slides sit on */
  --lav-ink: #6f4a96;
  --forest-tint: #e3edeb;
  --greeno-tint: #eaf4e3;
  --ember-tint:  #fdf0dc;
  --lav-tint:    #f7ebff;
  --stone-tint:  #f4f4e4;

  --accent:     var(--forest);
  --accent-ink: var(--forest);
  --tint:       var(--forest-tint);
  --s: 1;

  color-scheme: light;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* The slides keep their own light world in either theme. A deck is a printed
   object. Only the mat behind it follows the viewer. */
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --mat: #17171a; } }
:root[data-theme="dark"] { --mat: #17171a; }

* { box-sizing: border-box; }
body { margin: 0; background: var(--mat); font-family: var(--body); }
img, svg { max-width: 100%; }

/* ── the stack, and the page ──────────────────────────────────────────────── */

.deck { display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 22px 0 40px; }
.fit  { width: calc(1280px * var(--s)); height: calc(720px * var(--s)); }
.fit > .slide {
  transform: scale(var(--s)); transform-origin: top left;
  /* outline, not border: it scales with the transform and costs zero layout,
     so the content box is byte for byte identical on screen and in print. */
  outline: 2px solid var(--ink); outline-offset: -2px;
  border-radius: 6px;
}

.slide {
  position: relative;
  width: 1280px;
  height: 720px;            /* FIXED, and overflow hidden. It clips in silence. */
  padding: 64px 78px 54px;
  background: var(--canvas);
  color: var(--ink);
  overflow: hidden;
  page-break-after: always;
  break-after: page;
  display: flex;
  flex-direction: column;
}
.slide::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0;
  height: 5px; background: var(--accent);
}
.slide.forest { background: var(--forest); color: var(--on-dark); }
.slide.forest::before { background: var(--greeno-light); }

@media print {
  :root { --s: 1; }
  body  { background: #fff; }
  .deck { display: block; gap: 0; padding: 0; }
  .fit  { width: auto; height: auto; }
  .fit > .slide { transform: none; outline: 0; border-radius: 0; }
  .dl { display: none !important; }
}

/* ── accents ──────────────────────────────────────────────────────────────
   One class per slide sets the pair. Every component reads --accent and
   --tint and never names a colour. Colour is load-bearing here:

     forest  = Greeno himself, the product, the deck's own voice
     ember   = what is broken, and what he is not allowed to do
     greeno  = money, growth, the moments that make it work
     lavender= the market and the ask, because lavender is the action colour

   No two neighbouring slides share an accent. Check the run before shipping. */

.ac-forest { --accent: var(--forest);      --accent-ink: var(--forest);     --tint: var(--forest-tint); }
.ac-greeno { --accent: var(--greeno);      --accent-ink: var(--greeno-dark);--tint: var(--greeno-tint); }
.ac-ember  { --accent: var(--ember);       --accent-ink: #a86c14;           --tint: var(--ember-tint); }
.ac-lav    { --accent: var(--lavender);    --accent-ink: var(--lav-ink);    --tint: var(--lav-tint); }

/* ── type ─────────────────────────────────────────────────────────────────── */

h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; }
h1 { font-size: 104px; letter-spacing: -.038em; line-height: .9; }
h2 { font-size: 52px;  letter-spacing: -.028em; line-height: 1.0; }
.em { font-style: italic; }

.kicker {
  font-family: var(--body); font-weight: 600; font-size: 11.5px;
  letter-spacing: .16em; text-transform: uppercase; color: var(--fog);
  margin: 0 0 18px;
}
.slide.forest .kicker { color: rgba(255,255,235,.52); }

.lede { font: 500 21px/1.45 var(--body); color: var(--charcoal); max-width: 52ch; margin: 22px 0 0; }
.slide.forest .lede { color: rgba(255,255,235,.78); }
.note { font: 500 16px/1.45 var(--body); color: var(--charcoal); max-width: 88ch; margin: 20px 0 0; }
.note.wide { max-width: none; }
.closer { font: italic 400 21px/1.4 var(--display); color: var(--accent-ink); margin: 20px 0 0; }
.sub { font: 600 12px/1 var(--body); letter-spacing: .14em; text-transform: uppercase;
       color: var(--fog); margin: 22px 0 12px; }

.src { font: 500 12.5px/1.45 var(--body); color: var(--fog); margin: 18px 0 0; }
.num { position: absolute; bottom: 26px; right: 78px;
       font: 500 13.5px/1 var(--body); color: var(--fog);
       font-variant-numeric: tabular-nums; }
.wm  { position: absolute; bottom: 26px; left: 78px;
       font: 500 13.5px/1 var(--body); color: var(--fog); }
.slide.forest .num, .slide.forest .wm { color: rgba(255,255,235,.38); }

.body { flex: 1; display: flex; flex-direction: column; justify-content: center; }
.body.top { justify-content: flex-start; }
.head { flex: none; }

/* ── density modifiers ────────────────────────────────────────────────────
   Evidence slides carry the most. They get their own compression instead of
   every other slide shrinking to match. Reach for one of these before you
   reach for a font size. */

.dense h2 { font-size: 46px; }
.dense .lede { font-size: 19px; margin-top: 18px; }
.pack { padding-top: 48px; }
.pack h2 { font-size: 42px; }
.rows td, .rows th { font-size: 15px !important; }

/* ── cards ────────────────────────────────────────────────────────────────── */

.card {
  background: var(--surface);
  border: 2px solid var(--ink);
  border-radius: var(--r-card);
  padding: 24px 26px;
}
.card h3 { font-size: 27px; letter-spacing: -.02em; margin: 0 0 8px; }
.card p  { font: 500 15.5px/1.46 var(--body); color: var(--charcoal); margin: 0; }
.card .tag {
  display: inline-flex; align-self: flex-start; align-items: center;
  font: 600 11px/1 var(--body); letter-spacing: .1em; text-transform: uppercase;
  padding: 7px 12px; border-radius: var(--r-pill);
  background: var(--tint); color: var(--accent-ink); margin-bottom: 12px;
}
.card .n {
  font: 500 13px/1 var(--body); color: var(--accent-ink);
  letter-spacing: .08em; margin: 0 0 14px;
}

.fork { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.fork.three { grid-template-columns: repeat(3, 1fr); }
.fork.three .card { display: flex; flex-direction: column; }
/* An inline-block pill inside a flex column becomes a flex item and stretches
   the whole card. It stops looking like a pill. */
.fork.three .card .tag { align-self: flex-start; }

.two { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
.split { display: grid; grid-template-columns: 1.5fr 1fr; gap: 44px; align-items: center; }
.comp  { display: grid; grid-template-columns: 1.7fr 1fr; gap: 30px; align-items: start; }

.bigbox {
  background: var(--tint);
  border: 2px solid var(--ink);
  border-radius: var(--r-card-lg);
  padding: 30px 32px;
  display: flex; flex-direction: column;
}
.bigbox i {
  font-style: normal; font: 600 11.5px/1 var(--body);
  letter-spacing: .14em; text-transform: uppercase; color: var(--fog);
  margin-bottom: 16px;
}
.bigbox b { display: block; font: 400 34px/1.06 var(--display); letter-spacing: -.02em;
            color: var(--ink); margin-bottom: 12px; }
.bigbox span { font: 500 15.5px/1.46 var(--body); color: var(--charcoal); }
.bigbox .fig { font: 400 54px/1 var(--display); letter-spacing: -.03em;
               color: var(--accent-ink); margin-bottom: 8px; }

/* ── evidence ─────────────────────────────────────────────────────────────
   .strip is naked figures on a hairline. .stats is the same figures in
   bordered cards. That is a real decision, not a style: cards say "these are
   exhibits", a strip says "this is just true". Use the strip for evidence. */

.strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0;
         border-top: 2px solid var(--ink); }
.strip.four { grid-template-columns: repeat(4, 1fr); }
.strip div { padding: 24px 26px 4px 0; border-right: 1px solid var(--stone); }
.strip div:last-child { border-right: 0; }
.strip b { display: block; font: 400 62px/1 var(--display); letter-spacing: -.035em;
           color: var(--accent-ink); }
.strip span { display: block; font: 500 15px/1.42 var(--body); color: var(--charcoal);
              margin-top: 10px; max-width: 26ch; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.stats div { border: 2px solid var(--ink); border-radius: var(--r-card); padding: 22px 24px; }
.stats b { display: block; font: 400 46px/1 var(--display); letter-spacing: -.03em;
           color: var(--accent-ink); }
.stats span { display: block; font: 500 14.5px/1.42 var(--body); color: var(--charcoal); margin-top: 8px; }

.band {
  background: var(--tint); border: 2px solid var(--ink); border-radius: var(--r-card);
  padding: 22px 28px; display: flex; align-items: baseline; gap: 18px;
}
.band small { font: 600 11.5px/1 var(--body); letter-spacing: .14em; text-transform: uppercase;
              color: var(--fog); flex: none; }
.band b { font: 400 34px/1 var(--display); letter-spacing: -.025em; color: var(--ink); flex: none; }
.band span { font: 500 15.5px/1.45 var(--body); color: var(--charcoal); }

/* the funnel. TAM, SAM, SOM, with the filter named between them. */
.funnel { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; align-items: stretch; gap: 0; }
.fstep {
  border: 2px solid var(--ink); border-radius: var(--r-card); padding: 24px 26px;
  display: flex; flex-direction: column;
}
.fstep:last-of-type { background: var(--tint); }
.fstep i { font-style: normal; font: 600 11.5px/1 var(--body); letter-spacing: .14em;
           text-transform: uppercase; color: var(--fog); }
.fstep b { display: block; font: 400 52px/1 var(--display); letter-spacing: -.035em;
           color: var(--accent-ink); margin: 16px 0 10px; }
.fstep span { font: 500 14.5px/1.42 var(--body); color: var(--charcoal); }
.fgate { display: flex; flex-direction: column; justify-content: center; align-items: center;
         padding: 0 16px; width: 152px; }
.fgate em { font-style: normal; font: 500 12.5px/1.35 var(--body); color: var(--fog);
            text-align: center; margin-bottom: 8px; }
.fgate s { text-decoration: none; color: var(--accent); font-size: 20px; line-height: 1; }

/* ── argument ─────────────────────────────────────────────────────────────── */

.bul { list-style: none; margin: 20px 0 0; padding: 0; }
.bul li {
  position: relative; padding: 8px 0 8px 20px;
  font: 500 16.5px/1.45 var(--body); color: var(--charcoal);
}
.bul li::before {
  content: ""; position: absolute; left: 0; top: 16px;
  width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
}
.bul.sm li { font-size: 15px; padding: 6px 0 6px 18px; }
.bul.sm li::before { top: 14px; width: 6px; height: 6px; }
.bul li.ev {
  color: var(--accent-ink); border-top: 1px solid var(--stone); margin-top: 8px; padding-top: 14px;
}
.bul li.ev::before { top: 22px; }
.card .bul li { border-top: 0; }

.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.steps div { border: 2px solid var(--ink); border-radius: var(--r-card); padding: 22px 24px; }
.steps i { font-style: normal; font: 400 30px/1 var(--display); color: var(--accent-ink); }
.steps b { display: block; font: 400 24px/1.1 var(--display); letter-spacing: -.02em;
           margin: 12px 0 8px; }
.steps span { font: 500 15px/1.44 var(--body); color: var(--charcoal); }

.ticks { list-style: none; margin: 22px 0 0; padding: 0; display: grid; gap: 12px; }
.ticks li { position: relative; padding-left: 30px; font: 500 16.5px/1.45 var(--body); color: var(--charcoal); }
.ticks li::before {
  content: ""; position: absolute; left: 0; top: 5px; width: 16px; height: 9px;
  border-left: 2.5px solid var(--accent); border-bottom: 2.5px solid var(--accent);
  transform: rotate(-45deg);
}
.slide.forest .ticks li { color: rgba(255,255,235,.82); }

/* the allowlist chips, lifted from the site so the deck and the page agree */
.chips { display: flex; flex-wrap: wrap; gap: 9px; }
.chip {
  font: 600 14px/1 var(--body); padding: 11px 16px; border-radius: var(--r-pill);
  border: 2px solid var(--ink); background: var(--surface); color: var(--ink);
}
.chip.ask   { background: var(--ember); }
.chip.never { border-style: dashed; border-color: var(--fog); color: var(--fog); background: transparent;
              text-decoration: line-through; text-decoration-thickness: 1.5px; }

/* ── money ────────────────────────────────────────────────────────────────
   Free and paid are two visible divisions inside one box, so nobody reads the
   free column as the whole offer. There is no bare $0 anywhere. */

.tiersplit { display: grid; grid-template-columns: 1fr 1fr; border: 2px solid var(--ink);
             border-radius: var(--r-card-lg); overflow: hidden; }
.tiersplit > div { padding: 26px 28px; }
.tiersplit > div:first-child { border-right: 2px solid var(--ink); background: var(--stone-tint); }
.tiersplit > div:last-child { background: var(--tint); }
.tiersplit i { font-style: normal; font: 600 11.5px/1 var(--body); letter-spacing: .14em;
               text-transform: uppercase; color: var(--fog); }
.tiersplit .p { font: 400 40px/1 var(--display); letter-spacing: -.03em; margin: 14px 0 4px; }
.tiersplit .p small { font: 500 15px/1 var(--body); color: var(--fog); }

.qgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.qcell { border: 2px solid var(--ink); border-radius: var(--r-card); padding: 22px 22px; }
.qcell.on { background: var(--tint); }
.qcell i { font-style: normal; font: 600 11.5px/1 var(--body); letter-spacing: .14em;
           text-transform: uppercase; color: var(--accent-ink); }
.qcell b { display: block; font: 400 23px/1.12 var(--display); letter-spacing: -.02em; margin: 12px 0 10px; }
.qcell span { font: 500 14.5px/1.44 var(--body); color: var(--charcoal); }

/* ── competition ──────────────────────────────────────────────────────────
   Five rows, grouped by what a category is, each ending on the sentence that
   matters: what it still leaves you to do. Not forty-two cells. */

.matrix { width: 100%; border-collapse: collapse; }
.matrix th {
  text-align: left; font: 600 11.5px/1 var(--body); letter-spacing: .14em;
  text-transform: uppercase; color: var(--fog); padding: 0 14px 12px 0;
  border-bottom: 2px solid var(--ink);
}
.matrix td { padding: 15px 14px 15px 0; border-bottom: 1px solid var(--stone);
             font: 500 16px/1.4 var(--body); color: var(--charcoal); vertical-align: top; }
.matrix td:first-child { font-weight: 600; color: var(--ink); width: 22%; }
.matrix td:first-child small { display: block; font-weight: 500; font-size: 13px; color: var(--fog); margin-top: 3px; }
.matrix td.price { text-align: right; white-space: nowrap; color: var(--ink); font-variant-numeric: tabular-nums; }
.matrix th:last-child { text-align: right; }
.matrix tr.us td { background: var(--tint); border-bottom: 2px solid var(--ink); }
.matrix tr.us td:first-child { border-radius: 12px 0 0 12px; padding-left: 14px; }
.matrix tr.us td:last-child { border-radius: 0 12px 12px 0; padding-right: 14px; }

/* ── traction ─────────────────────────────────────────────────────────────── */

.tract { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.tract div { border-top: 2px solid var(--ink); padding: 16px 16px 0 0; }
.tract b { display: block; font: 400 38px/1 var(--display); letter-spacing: -.03em; color: var(--accent-ink); }
.tract span { display: block; font: 500 14px/1.4 var(--body); color: var(--charcoal); margin-top: 8px; }
/* A figure the founder has to fill in before this deck leaves the building.
   It is meant to be impossible to miss. */
.tbd { border: 2px dashed var(--ember) !important; border-radius: 10px; padding: 2px 8px;
       color: var(--ember) !important; }

/* ── the laws list, on forest ─────────────────────────────────────────────── */

.laws { list-style: none; margin: 26px 0 0; padding: 0;
        display: grid; grid-template-columns: 1fr 1fr; gap: 16px 34px; }
.laws li { border-top: 1px solid rgba(255,255,235,.2); padding-top: 12px; }
.laws b { display: block; font: 600 16px/1.35 var(--body); color: var(--on-dark); }
.laws span { display: block; font: 500 14.5px/1.42 var(--body); color: rgba(255,255,235,.6); margin-top: 4px; }

/* ── cover and close ──────────────────────────────────────────────────────── */

.cover { display: grid; grid-template-columns: 1.15fr .85fr; gap: 48px; align-items: center; height: 100%; }
.markrow { display: flex; align-items: flex-end; gap: 22px; }
.cover h1 { color: var(--on-dark); }
.cover .sig { font: 500 19px/1.5 var(--body); color: rgba(255,255,235,.74); margin: 26px 0 0; max-width: 40ch; }
.cover .mascot { width: 210px; }
.covercap {
  font: 500 15px/1.4 var(--body); color: rgba(255,255,235,.44);
  margin-top: 22px; max-width: 30ch;
}
.live {
  display: inline-flex; align-items: center; gap: 9px;
  font: 600 13px/1 var(--body); padding: 10px 16px; border-radius: var(--r-pill);
  border: 2px solid rgba(255,255,235,.34); color: var(--on-dark);
}
.live s { text-decoration: none; width: 8px; height: 8px; border-radius: 50%; background: var(--ember); }

.ask { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
.ask div { border: 2px solid rgba(255,255,235,.3); border-radius: var(--r-card); padding: 22px 24px; }
.ask i { font-style: normal; font: 600 11.5px/1 var(--body); letter-spacing: .14em;
         text-transform: uppercase; color: rgba(255,255,235,.5); }
.ask b { display: block; font: 400 30px/1.1 var(--display); color: var(--on-dark); margin: 12px 0 8px; }
.ask span { font: 500 15px/1.44 var(--body); color: rgba(255,255,235,.66); }

/* ── the notch, drawn in markup ───────────────────────────────────────────
   Never a pasted screenshot. It stays sharp, it follows the slide, and a
   wrong label is a word to fix rather than a re-export. */

.shot { border: 2px solid var(--ink); border-radius: var(--r-card-lg); overflow: hidden;
        background: linear-gradient(170deg, #f6f6dd, #ffffeb 55%); }
.shot-bar { height: 30px; border-bottom: 1px solid var(--stone); display: flex; align-items: center;
            gap: 6px; padding: 0 14px; font: 600 10.5px/1 var(--body); color: var(--fog); letter-spacing: .04em; }
.shot-bar i { width: 8px; height: 8px; border-radius: 50%; background: var(--stone); }
.shot-body { position: relative; height: 234px; }
.nf { position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 430px; border-radius: 0 0 24px 24px; background: #000; color: #fff;
      padding: 16px 22px 18px; }
.nf-label { font: 650 9px/1 var(--body); letter-spacing: .14em; text-transform: uppercase;
            color: rgba(255,255,255,.6); }
.nf-lines { display: grid; gap: 6px; margin-top: 10px; }
.nf-lines p { margin: 0; font: 500 15px/1.4 var(--body); color: #f7f7f5; }
.nf-lines p.dim { color: rgba(255,255,255,.34); }
.nf-foot { display: flex; gap: 7px; margin-top: 12px; }
.nf-chip { font: 600 11px/1 var(--body); padding: 7px 12px; border-radius: var(--r-pill);
           background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14);
           color: rgba(255,255,255,.82); }
.nf-chip.primary { background: rgba(255,255,255,.9); color: #050505; border-color: transparent; }
.shot-floor { position: absolute; bottom: 0; left: 0; right: 0; padding: 0 18px 14px;
              font: 500 13px/1.4 var(--body); color: var(--fog); }
.shot .mascot { position: absolute; bottom: 30px; left: 30px; width: 62px; }

/* ── the guard ────────────────────────────────────────────────────────────
   Half these components style their own <b> as a display-size block title.
   That is right for a title and wrong for emphasis inside a sentence. This
   block is declared last so it wins. Add any new component with a <b> title
   to this list in the same commit. */
